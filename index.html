<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <title>Fuego y cenizas. Pausas hasta el momento</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    html,body { margin:0; min-height:100%; background:#08090c; color:#eeeae5; }
    body { overflow-x:hidden; }
    button { font:inherit; }
    .screen { min-height:100svh; position:relative; overflow:hidden; }
    #intro { display:grid; place-items:center; padding:28px 20px; background:#303033; }
    #intro-canvas { position:absolute; inset:0; width:100%; height:100%; }
    .intro-copy { position:relative; z-index:1; width:min(94vw,800px); text-align:center; margin-top:-3vh; }
    .eyebrow { color:#d0ced0; font-size:.65rem; letter-spacing:.3em; text-transform:uppercase; }
    h1 { margin:20px 0 14px; font:500 clamp(2.5rem,9.5vw,6.2rem)/.96 Arial,sans-serif; letter-spacing:.015em;
      text-shadow:0 2px 18px #13131688; }
    h1 span { display:block; margin-top:16px; color:#e3e0dc; font:300 clamp(.76rem,2vw,1.1rem)/1.3 Arial,sans-serif;
      letter-spacing:.42em; }
    .intro-note { color:#c4c1c0; line-height:1.65; }
    .action { margin-top:24px; min-height:44px; padding:0 23px; border:1px solid #bab8ba;
      background:#d9d7d7; color:#18181b; letter-spacing:.05em; cursor:pointer; transition:transform .2s,background .2s; }
    .action:hover { transform:translateY(-2px); background:#fff; }
    #garden { display:none; padding:30px 18px 64px; background:radial-gradient(ellipse at 50% 20%,#3a3a3d 0,#202024 65%,#111216 100%); }
    #garden.visible { display:block; animation:fade-in .9s both; }
    .garden-inner { width:min(100%,980px); margin:0 auto; }
    .garden-title { margin:0; text-align:center; font:500 clamp(1.9rem,6vw,3.5rem)/1 Georgia,serif; }
    .garden-sub { text-align:center; color:#a4a7ad; letter-spacing:.16em; text-transform:uppercase; font-size:.67rem; }
    .flower-row { display:grid; grid-template-columns:1fr .7fr 1fr; align-items:center; gap:8px; width:min(100%,760px); margin:22px auto 30px; }
    .flower-choice { min-width:0; border:0; background:transparent; color:#d8d8d8; cursor:pointer; padding:6px 0; }
    .flower-choice canvas { display:block; width:100%; height:auto; aspect-ratio:1.1; }
    .flower-choice span { display:block; margin-top:4px; font-size:.69rem; letter-spacing:.18em; text-transform:uppercase; }
    .flower-choice.blue span { color:#83caff; }
    .flower-choice.red span { color:#ff6475; }
    .flower-choice.black span { color:#aeb4bf; }
    .flower-choice:hover canvas { filter:brightness(1.25); }
    #reading { display:none; grid-template-columns:minmax(190px,.75fr) minmax(0,1.5fr); gap:clamp(20px,5vw,55px);
      align-items:start; padding:clamp(20px,4vw,38px); border-top:1px solid #343943; background:#0c0e13; }
    #reading.visible { display:grid; animation:fade-in .8s both; }
    .ascii-rose { position:sticky; top:18px; margin:0; white-space:pre; overflow:hidden; text-align:center;
      font:clamp(7px,1.28vw,11px)/1.12 Consolas,monospace; background:linear-gradient(145deg,var(--rose-light),var(--rose-mid) 50%,var(--rose-dark));
      color:transparent; -webkit-background-clip:text; background-clip:text; filter:drop-shadow(0 0 14px var(--rose-glow)); }
    .story-label { color:var(--rose-light); text-transform:uppercase; letter-spacing:.22em; font-size:.68rem; }
    #story-title { margin:10px 0 22px; color:#f2ece3; font:500 clamp(1.8rem,5vw,3.1rem)/1.05 Georgia,serif; }
    #story-copy { color:#e5e0d8; font:400 clamp(1rem,1.5vw,1.16rem)/1.8 Georgia,serif; }
    #story-copy p { margin:0 0 1.08em; white-space:pre-wrap; }
    .story-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:24px; }
    .secondary { border:1px solid #646872; background:transparent; color:#ddd; padding:10px 14px; cursor:pointer; }
    #status { position:fixed; z-index:8; left:50%; bottom:max(10px,env(safe-area-inset-bottom)); transform:translateX(-50%);
      width:max-content; max-width:94vw; padding:5px 8px; color:#ddd; background:#08090ccc; text-align:center; font-size:.73rem; }
    audio { position:fixed; z-index:9; left:50%; bottom:max(34px,env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(92vw,360px); }
    audio:not([controls]) { display:none; }
    @keyframes fade-in { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    @media(max-width:640px) {
      #garden { padding:24px 13px 52px; }
      .flower-row { gap:0; margin:18px auto 22px; }
      .flower-choice span { font-size:.56rem; letter-spacing:.1em; }
      #reading { grid-template-columns:1fr; gap:15px; padding:20px 16px 28px; }
      .ascii-rose { position:relative; top:auto; font-size:8px; line-height:1.08; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <section id="intro" class="screen">
    <canvas id="intro-canvas" aria-hidden="true"></canvas>
    <div class="intro-copy">
      <p class="eyebrow">una historia en tres colores</p>
      <h1>FUEGO &amp; CENIZAS<span>PAUSAS POR RATOS</span></h1>
      <p class="intro-note">Azul para lo que se atreve a quedarse.<br>Rojo para quien siempre regresa.</p>
      <button class="action" id="begin" type="button">Abrir la historia</button>
    </div>
  </section>

  <main id="garden" class="screen" aria-label="Elige una parte de la historia">
    <div class="garden-inner">
      <h2 class="garden-title">Elige una pausa</h2>
      <p class="garden-sub">toca una flor para abrir su historia</p>
      <div class="flower-row">
        <button class="flower-choice blue" data-flower="blue" id="blue-choice" type="button" aria-label="Abrir la primera parte, rosa azul">
          <canvas width="310" height="250" aria-hidden="true"></canvas><span>Azul · Parte I</span>
        </button>
        <button class="flower-choice black" data-flower="black" id="black-choice" type="button" aria-label="Abrir la tercera parte, rosa negra">
          <canvas width="230" height="220" aria-hidden="true"></canvas><span>Negra · Parte III</span>
        </button>
        <button class="flower-choice red" data-flower="red" id="red-choice" type="button" aria-label="Abrir la segunda parte, rosa roja">
          <canvas width="310" height="250" aria-hidden="true"></canvas><span>Roja · Parte II</span>
        </button>
      </div>
      <section id="reading" aria-live="polite">
        <pre class="ascii-rose" id="ascii-rose" aria-label="Rosa ASCII"></pre>
        <div>
          <div class="story-label" id="story-label"></div>
          <h2 id="story-title"></h2>
          <div id="story-copy"></div>
          <div class="story-actions">
            <button class="secondary" id="choose-other" type="button">Elegir otra flor</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <p id="status" aria-live="polite"></p>
  <audio id="song" autoplay loop preload="auto" playsinline
    src="https://github.com/DemoonyAbyss/fuego-y-cenizas-nfc/releases/download/v1/5.Seconds.of.Summer.-.Lover.Of.Mine.Official.Audio.mp4"></audio>

  <script>
  (() => {
    const stories = {
      blue: {
        label: 'Parte I · Azul', title: 'La excepción',
        colors: ['#bfe6ff','#4f9ed8','#15345f','#68b9ff'],
        paragraphs: [
          'La lluvia caía sobre las ruinas de la estación, y El no se molestó en voltear cuando escuchó los pasos. Conocía esa forma de caminar: ligera, terca, sin una pizca de miedo.',
          '—Vete —dijo, sin mirarla.',
          '—No.',
          'Ella se detuvo a pocos pasos. Tenía los ojos fijos en él, y eso era lo que más le irritaba: que lo mirara así, como si pudiera ver algo ahí dentro.',
          '—Dices que no tienes nada que perder —murmuró él por fin, girándose despacio—, pero me miras como si yo fuera la excepción.',
          'Ella no respondió. No hacía falta. El silencio entre los dos pesaba más que cualquier amenaza que él hubiera lanzado jamás.',
          'Apretó los puños. Había enfrentado ejércitos, había visto caer el cielo y había cargado con una promesa que no le dejaba descansar. Nada de eso lo había preparado para alguien que se quedaba.',
          '—No me salves —dijo al fin, con la voz más baja de lo que pretendía—. No sé qué hacer con alguien que se niega a rendirse conmigo.',
          'Y por primera vez, la sombra que no temía a nada retrocedió un paso.'
        ]
      },
      red: {
        label: 'Parte II · Rojo', title: 'Regresaré siempre',
        colors: ['#ffc5c8','#e45462','#681b30','#ff536e'],
        paragraphs: [
          'Ella había aprendido a leer los silencios. No eran vacíos, eran muros. Y cada muro, pensaba ella, tenía una grieta si uno sabía dónde presionar.',
          'Esa noche, bajo la luz rota de un farol, él la miró con algo parecido a la rabia y, debajo, algo mucho más frágil.',
          '—Puedes empujarme tan lejos como quieras —le dijo, y su voz no tembló—. Regresaré siempre.',
          'No era una súplica. Era un hecho, tan simple y tan inevitable como el amanecer después de la peor de las noches.',
          'La sombra giró el rostro, pero Ella alcanzó a ver cómo se le tensaba la mandíbula.',
          '—Me advertiste que ibas a destruirme —continuó, acercándose un paso más—. Y aun así me entregué.',
          'Lo dijo sin arrepentimiento. Sabía lo que costaba amar a alguien hecho de fuego y cenizas, y lo había elegido de todos modos, con los ojos abiertos.',
          'Entre ellos, la lluvia seguía cayendo, y ninguno de los dos se movió para huir.'
        ]
      },
      black: {
        label: 'Parte III · Negra', title: 'Fuego suficiente',
        colors: ['#c3c8d2','#68717e','#171a20','#aeb9d1'],
        paragraphs: [
          'El trueno rompió el cielo, y con él, algo se quebró también dentro de El.',
          'Ella había dado el último paso. Ya no quedaba distancia entre los dos, solo la lluvia deslizándose por su cabello y el latido furioso que ninguno de los dos podía fingir que no escuchaba.',
          '—Deberías odiarme —susurró él. Ya no sonaba a advertencia. Sonaba a súplica.',
          '—Lo intenté —respondió ella, y una sonrisa temblorosa le cruzó el rostro—. Fracasé en todos los intentos.',
          'La sombra cerró los ojos. Durante años había cargado con la oscuridad como quien carga una condena, convencido de que era lo único que le pertenecía. Y ahora esta chica terca, con sus ojos que me hacen perderme y su fe absurda, le decía que había algo más ahí dentro. Algo que valía la pena encontrar.',
          '—No sé cómo se hace esto —confesó.',
          '—Yo tampoco —dijo —. Pero no pienso soltarte.',
          'Él alzó la mano, dudando, como si temiera que su toque pudiera romperla. Los dedos apenas rozaron su mejilla, y ella inclinó el rostro contra su palma sin una pizca de miedo.',
          'Eso fue lo que lo deshizo.',
          'La atrajo hacia él con un movimiento brusco, desesperado, y la abrazó como quien por fin deja de resistirse a la gravedad. Ella se aferró a su pecho, y por un instante el mundo entero, con sus guerras y sus promesas y sus fantasmas, quedó fuera.',
          '—Si me quedo —murmuró él contra su cabello—, no habrá vuelta atrás.',
          '—Entonces quédate —respondió ella—. Yo ya elegí.',
          'La lluvia siguió cayendo sobre las ruinas, pero ninguno de los dos sintió el frío. Tenían fuego suficiente entre ellos.'
        ]
      }
    };
    const palettes = {
      blue: {light:'#bfe6ff',mid:'#4f9ed8',dark:'#15345f'},
      red: {light:'#ffc5c8',mid:'#e45462',dark:'#681b30'},
      black: {light:'#aeb7c4',mid:'#555e6b',dark:'#12151b'}
    };
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const introCanvas = document.getElementById('intro-canvas'), introCtx = introCanvas.getContext('2d');
    let iw=0, ih=0, tick=0;
    function sizeIntro(){const d=Math.min(devicePixelRatio||1,2);iw=innerWidth;ih=innerHeight;
      introCanvas.width=iw*d;introCanvas.height=ih*d;introCtx.setTransform(d,0,0,d,0,0);}
    addEventListener('resize',sizeIntro,{passive:true});sizeIntro();
    const grain=Array.from({length:1900},(_,i)=>({x:((i*97.13)%997)/997,y:((i*61.77)%991)/991,a:.025+((i*13)%40)/1000}));
    const blossoms=[
      [.72,.22,.8,'blue'],[.88,.34,.66,'red'],[.63,.43,.74,'blue'],[.91,.57,.72,'red'],
      [.72,.72,.9,'red'],[.48,.81,.72,'blue'],[.94,.88,.68,'blue']
    ];
    function renderIntro(){
      tick+=.012;const c=introCtx;c.clearRect(0,0,iw,ih);
      const bg=c.createLinearGradient(0,0,iw,ih);bg.addColorStop(0,'#39393b');bg.addColorStop(.55,'#303033');bg.addColorStop(1,'#25262a');
      c.fillStyle=bg;c.fillRect(0,0,iw,ih);
      for(const g of grain){c.globalAlpha=g.a;c.fillStyle=(g.x*1000|0)%3?'#d4d0cd':'#07080a';c.fillRect(g.x*iw,g.y*ih,1.2,1.2);}c.globalAlpha=1;
      const blue=['#d5e4ff','#779be9','#3462ad'],red=['#ffd5e0','#ee809d','#a83e68'];
      function pixel(x,y,color,size=8,glyph=''){
        c.fillStyle=color;c.fillRect(x-size/2,y-size/2,size,size);
        if(glyph){c.globalAlpha=.55;c.fillStyle='#f4eef0';c.font=`${Math.max(6,size*.8)}px Consolas,monospace`;c.textAlign='center';c.textBaseline='middle';c.fillText(glyph,x,y);c.globalAlpha=1;}
      }
      function branch(x1,y1,x2,y2,phase){
        const n=Math.ceil(Math.hypot(x2-x1,y2-y1)/8);
        for(let i=0;i<=n;i++){
          const q=i/n,curve=Math.sin(q*Math.PI)*Math.sin(tick+phase)*7;
          const x=x1+(x2-x1)*q+curve,y=y1+(y2-y1)*q;
          pixel(x,y,q>.68?'#4793d5':'#3474b7',7,i%4===0?'+':'');
        }
      }
      const centers=blossoms.map((b,i)=>[b[0]*iw+Math.sin(tick*.4+i)*4,b[1]*ih+Math.cos(tick*.35+i)*3,b[2],b[3],i]);
      // Pixel stems connect the blooms like a drifting branch.
      for(let i=0;i<centers.length;i++)branch(i===0?iw*.40:centers[(i+1)%centers.length][0],i===0?ih*.96:centers[(i+1)%centers.length][1],centers[i][0],centers[i][1]+12,i);
      for(const [cx,cy,scale,tone,index] of centers){
        const colors=tone==='blue'?blue:red,open=.88+.12*Math.sin(tick*.8+index),cell=Math.max(6,Math.min(10,iw*.012))*scale;
        for(let gy=-6;gy<=6;gy++)for(let gx=-6;gx<=6;gx++){
          let petal=-1;
          for(let k=0;k<5;k++){
            const a=k*Math.PI*2/5+tick*.025,px=Math.cos(a)*2.8*open,py=Math.sin(a)*2.5*open;
            if(((gx-px)**2+(gy-py)**2/1.15)<7.4*open){petal=k;break;}
          }
          const core=gx*gx+gy*gy<3.2;
          if(petal>=0||core){
            const shade=core?2:(Math.abs(gx+gy+index)%4===0?1:0);
            const glyph=(gx+gy+index)%5===0?'+':(gx-gy)%4===0?'.':'';
            pixel(cx+gx*cell,cy+gy*cell,colors[shade],cell,glyph);
          }
        }
      }
      // A few loose square pixels drift off the branch.
      for(let i=0;i<38;i++){
        const x=(i*83+tick*(5+i%4))%iw,y=(i*127+tick*(10+i%3*3))%ih;
        pixel(x,y,i%2?'#6797d2':'#db8299',2+(i%2),i%7===0?'+':'');
      }
      if(document.getElementById('intro').classList.contains('active'))requestAnimationFrame(renderIntro);
    }
    document.getElementById('intro').classList.add('active');requestAnimationFrame(renderIntro);

    function drawRose(canvas,palette,phase=0,opening=1){
      const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
      const cols=Math.floor(w/10),rows=Math.floor(h/13),cx=(cols-1)/2,cy=rows*.47;
      ctx.clearRect(0,0,w,h);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='13px Consolas,monospace';
      for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
        const dx=(col-cx)/1.05,dy=(row-cy)/.66,r=Math.hypot(dx,dy),a=Math.atan2(dy,dx);
        const edge=1.2+opening*(5.8*Math.abs(Math.cos(4*a+phase)) + 1.15*Math.abs(Math.cos(8*a-phase*.7)));
        let ch='',color=palette.mid;
        if(r<=edge){
          if(r<1.2){ch='@%#'[Math.abs(row+col+Math.floor(tick*5))%3];color=palette.light;}
          else if(r>edge-.9){ch='.,:+*'[Math.abs(row*3+col)%5];color=palette.light;}
          else if(r>edge*.65){ch='%#*+'[(row+col)%4];color=palette.dark;}
          else {ch='*#%@'[(row*2+col)%4];color=palette.mid;}
        } else if(row>cy+2 && Math.abs(col-cx)<.7){ch=row%2?'|':'/';color=palette.dark;}
        else if(row>cy+4 && Math.abs(col-cx)>1 && Math.abs(col-cx)<4 && row%4===0){ch=col<cx?'<':'>';color=palette.mid;}
        if(ch) {ctx.fillStyle=color;ctx.fillText(ch,col*10+5,row*13+6);}
      }
    }
    let clock=0;
    const choices=[...document.querySelectorAll('.flower-choice')];
    function animateFlowers(now){clock=now/1000;
      choices.forEach((button,index)=>{
        const key=button.dataset.flower,p=palettes[key],canvas=button.querySelector('canvas');
        drawRose(canvas,p,clock*.12+index, .72+.28*(.5+.5*Math.sin(clock*.8+index*2)));
      });
      if(document.getElementById('garden').classList.contains('visible'))requestAnimationFrame(animateFlowers);
    }

    const roseLines=[];
    function makeAsciiRose(phase){
      const cols=39,rows=23,cx=19,cy=8,out=[];
      for(let y=0;y<rows;y++){
        let line='';
        for(let x=0;x<cols;x++){
          const dx=(x-cx)/1.12,dy=(y-cy)/.7,r=Math.hypot(dx,dy),a=Math.atan2(dy,dx);
          const edge=1.5+6.7*Math.abs(Math.cos(4*a+phase)) + 1.4*Math.abs(Math.cos(8*a-phase));
          let ch=' ';
          if(r<edge){if(r<1.2)ch='@';else if(r>edge-.75)ch='.,:+*'[Math.abs(x+y)%5];else if(r>edge*.66)ch='%#*+'[(x+y)%4];else ch='*#%@'[(x*3+y)%4];}
          else if(y>cy+2 && Math.abs(x-cx)<1) ch=y%2?'|':'/';
          else if(y>cy+5 && Math.abs(x-cx)>2 && Math.abs(x-cx)<6 && y%4===0) ch=x<cx?'<':'>';
          line+=ch;
        }
        out.push(line);
      }
      return out.join('\n');
    }
    const begin=document.getElementById('begin'),garden=document.getElementById('garden'),intro=document.getElementById('intro');
    const audio=document.getElementById('song'),status=document.getElementById('status');
    function tryMusic(){audio.play().then(()=>{audio.controls=false;status.textContent='';}).catch(()=>{
      audio.controls=true;status.textContent='El navegador bloqueó la música automática; aparece un reproductor de respaldo.';
    });}
    audio.addEventListener('error',()=>{audio.controls=true;status.textContent='No se encontró el MP4. Déjalo junto a esta página.';});
    tryMusic();
    begin.addEventListener('click',()=>{
      tryMusic();intro.classList.remove('active');intro.style.display='none';garden.classList.add('visible');
      requestAnimationFrame(animateFlowers);
      document.querySelector('.garden-title').animate([{opacity:0,letterSpacing:'.4em'},{opacity:1,letterSpacing:'0'}],{duration:1000,fill:'both'});
    });
    function typeStory(data,key){
      const reading=document.getElementById('reading');reading.classList.add('visible');
      reading.style.setProperty('--rose-light',data.colors[0]);reading.style.setProperty('--rose-mid',data.colors[1]);
      reading.style.setProperty('--rose-dark',data.colors[2]);reading.style.setProperty('--rose-glow',data.colors[3]+'77');
      document.getElementById('story-label').textContent=data.label;
      document.getElementById('story-title').textContent=data.title;
      document.getElementById('ascii-rose').textContent=makeAsciiRose(key==='blue'?0.25:key==='red'?1.1:.78);
      const copy=document.getElementById('story-copy');copy.replaceChildren();
      const chars=[...data.paragraphs.join('\n\n')];let pos=0,para=0,current=null;
      function type(){
        if(pos>=chars.length)return;
        if(chars[pos]==='\n'){pos++;if(chars[pos]==='\n'){pos++;current=null;para++;}setTimeout(type,180);return;}
        if(!current){current=document.createElement('p');copy.appendChild(current);}
        current.textContent+=chars[pos++];
        setTimeout(type,reduceMotion?0:12);
      }
      if(reduceMotion){data.paragraphs.forEach(text=>{const p=document.createElement('p');p.textContent=text;copy.appendChild(p);});}
      else type();
      reading.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'});
    }
    document.getElementById('blue-choice').addEventListener('click',()=>{tryMusic();typeStory(stories.blue,'blue');});
    document.getElementById('black-choice').addEventListener('click',()=>{tryMusic();typeStory(stories.black,'black');});
    document.getElementById('red-choice').addEventListener('click',()=>{tryMusic();typeStory(stories.red,'red');});
    document.getElementById('choose-other').addEventListener('click',()=>{
      document.getElementById('reading').classList.remove('visible');
      document.querySelector('.garden-title').scrollIntoView({behavior:'smooth',block:'start'});
    });
  })();
  </script>
</body>
</html>
